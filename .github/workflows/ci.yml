name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      relay_base_url:
        description: "Relay base URL baked into the debug APK"
        required: false
        default: "http://10.0.2.2:8080"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: relay (go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...
      - run: go vet ./...

  android:
    name: android (debug apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Deliberately not using android-actions/setup-android: it tries to
      # install the legacy "tools" package, which no longer exists and makes
      # the whole job die before it reaches our code. The runner image already
      # ships cmdline-tools, we only need the platform we compile against.
      - name: Install SDK platform
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/platform-tools:$PATH"
          sdkmanager --install "platforms;android-36" "build-tools;36.1.0"

      - uses: gradle/actions/setup-gradle@v4

      # No release publishing on purpose: the APK is an artifact you download
      # from the run, so nothing is announced or tagged until it is ready.
      - run: ./gradlew :app:assembleDebug --no-daemon "-PrelayBaseUrl=${{ inputs.relay_base_url || 'http://10.0.2.2:8080' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wearmemo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
